name: Validate

on:
  push:
    branches: ["main","feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/favicon.svg
      - name: Validate JavaScript syntax
        run: node --check assets/js/app.js
